name: ZAFA - NDX breadth experimental
on:
  push:
    paths:
      - 'scripts/update_ndx_breadth.py'
      - '.github/workflows/update-breadth.yml'
  schedule:
    - cron: '35 22 * * 1-5'
    - cron: '15 11 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'yfinance>=0.2.55' 'lxml>=5' 'requests>=2.32'
      - name: Calculate validated breadth for current Nasdaq-100 securities
        run: python scripts/update_ndx_breadth.py
      - name: Publish aggregated percentages and A/D counts only
        run: |
          git add data/ndx_breadth.json
          if git diff --cached --quiet; then
            echo 'No new breadth dataset'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: update Nasdaq-100 daily EOD breadth'
          # Other daily jobs (FRED/CFTC) may commit between checkout and publish.
          # The files are independent: rebase and retry rather than reject an EOD update.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published latest validated breadth"
              exit 0
            fi
            sleep 3
          done
          echo "Unable to publish breadth after retries"
          exit 1