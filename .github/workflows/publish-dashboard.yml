name: ATLAS - ponderi SPY si VIX
on:
  push:
    paths:
      - 'scripts/update_vix.py'
      - 'scripts/update_weights.py'
      - '.github/workflows/publish-dashboard.yml'
  schedule:
    - cron: '17 10 * * 1-5'
    - cron: '35 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instaleaza cititorul SPY
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Actualizeaza sectoarele SPY
        run: python scripts/update_weights.py
      - name: Actualizeaza VIX daily close Cboe
        run: python scripts/update_vix.py
      - name: Comite datele numai daca s-au schimbat
        run: |
          git add data/sector_weights.json data/vix_30d.json
          if git diff --cached --quiet; then
            echo "No new market data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh SPY weights and VIX history"
          git push