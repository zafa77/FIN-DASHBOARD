name: ATLAS - ponderi SPY automate
on:
  schedule:
    - cron: '17 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-sector-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instaleaza cititor XLSX
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Descarca ponderile SPY de la State Street
        run: python scripts/update_weights.py
      - name: Publica JSON in main, daca s-a schimbat
        run: |
          git add data/sector_weights.json
          if git diff --cached --quiet; then
            echo "No new sector weights to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh SPY sector weights"
          git push
